<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iPhone · плеер горизонтально</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vf.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.lq{min-height:34px;padding:0 11px;font-size:13px}
.lq svg{width:17px;height:17px}
</style>
</helmet>
<div class="strip dark-bg" style="width: 908px; height: 474px;">
  <div class="shot">
    <span class="shot-label">Горизонтально · управление в safe area · Fit</span>
    <div class="phone land vf" data-theme="dark" data-accent="{{accent}}" data-transparency="{{transparency}}">
      <div class="media" style="position: absolute; inset: 0;">
        <div class="art a9"></div><div class="shade-t"></div><div class="shade-b"></div>
        <div class="row between" style="position: absolute; left: 56px; right: 56px; top: 16px;">
          <div class="row" style="gap: 10px; min-width: 0;"><button class="pctl sm glass-media" aria-label="Свернуть"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button><div style="min-width: 0;"><p class="t-hl clamp1">Night ferry to the islands</p><p class="t-c1" style="color: #e6e6ea;">Night Walks · Очередь 4 из 12</p></div></div>
          <div class="row" style="gap: 8px;">
            <button class="pctl sm glass-media" aria-label="Блокировка ориентации"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10" width="12" height="10" rx="2"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"/></svg></button>
            <button class="pctl sm glass-media" aria-label="AirPlay"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17H4.5A1.5 1.5 0 0 1 3 15.5v-9A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v9a1.5 1.5 0 0 1-1.5 1.5H18"/><path d="m12 14 5 6H7z"/></svg></button>
            <button class="pctl sm glass-media" aria-label="Картинка в картинке"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="12" width="7" height="5" rx="1"/></svg></button>
          </div>
        </div>
        <div class="row center" style="position: absolute; left: 0; right: 0; top: 140px; gap: 40px;">
          <button class="pctl glass-media" aria-label="Предыдущее видео"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path class="fc" d="M19 5 9 12l10 7Z"/></svg></button>
          <button class="pctl glass-media" aria-label="Назад 10 секунд"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
          <button class="pctl big glass-media" aria-label="Пауза"><svg class="f" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg></button>
          <button class="pctl glass-media" aria-label="Вперёд 30 секунд"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg></button>
          <button class="pctl glass-media" aria-label="Следующее видео"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14"/><path class="fc" d="M5 5l10 7-10 7Z"/></svg></button>
        </div>
        <div style="position: absolute; left: 56px; right: 56px; bottom: 14px;">
          <div class="tl"><i class="buf" style="width: 40%;"></i><i class="pl" style="width: 22%;"></i><i class="chap" style="left: 30%;"></i><i class="chap" style="left: 64%;"></i><i class="knob" style="left: 22%;"></i></div>
          <div class="row" style="gap: 8px; margin-top: 10px;">
            <span class="t-c1 t-num" style="font-weight: 700;">01:48 / 08:12</span>
            <span class="grow"></span>
            <button class="qbtn lq glass-media">1,25×</button>
            <button class="qbtn lq glass-media">Авто · 1080p</button>
            <button class="qbtn lq glass-media"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/></svg>Перевод</button>
            <button class="qbtn lq glass-media" aria-label="Субтитры"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"/></svg></button>
            <button class="qbtn lq glass-media" aria-label="Fit или Fill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            <button class="qbtn lq glass-media" aria-label="Ещё"><svg class="f" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["coral","blue","red","orange","yellow","green","mint","teal","indigo","purple","pink"],"default":"coral"},"transparency":{"editor":"enum","options":["glass","reduced"],"default":"glass"},"$preview":{"width":908,"height":474}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'coral', transparency: this.props.transparency ?? 'glass' };
  }
}
</script>
</body>
</html>
