<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iPad · узкое окно</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vf.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="tablet vf" data-theme="{{theme}}" data-accent="{{accent}}" data-transparency="{{transparency}}" style="width: 600px; height: 834px; border-radius: 22px;">
  <div class="screen">
    <div style="height: 28px;"></div>
    <div class="largehead"><h1 class="t-lt">Главная</h1><span class="t-c1 t-sec">Окно 600 pt · compact</span></div>
    <div class="pad" style="padding-bottom: 12px;"><div class="chips"><span class="chip on">Главная</span><span class="chip">Рекомендации</span><span class="chip">Подписки</span><span class="chip">История</span></div></div>
    <div class="scroll pad col" style="gap: 18px;">
      <article class="card"><div class="thumb a0"><span class="dur">18:42</span><span class="prog"><i style="width: 34%;"></i></span></div><div class="meta"><span class="avatar c0" style="width: 34px; height: 34px;"></span><div class="grow"><p class="title clamp2">The long way home</p><p class="sub">Field Notes · 128 тыс. · 2 дня назад</p></div><button class="btn plain icon more" aria-label="Ещё"><svg class="f" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button></div></article>
      <article class="card"><div class="thumb a1"><span class="dur">12:08</span></div><div class="meta"><span class="avatar c1" style="width: 34px; height: 34px;"></span><div class="grow"><p class="title clamp2">Design in motion</p><p class="sub">Studio North · 46 тыс.</p></div></div></article>
    </div>
    <div class="tabbar-wrap" style="padding-left: 60px; padding-right: 60px;">
      <div class="accessory glass"><span class="thumb a3"></span><span class="tt"><b>Inside the sound</b><small>Sound Room</small></span><button class="navbtn" aria-label="Пауза"><svg class="f" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg></button><button class="navbtn" aria-label="Закрыть мини-плеер"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
      <div class="tabbar-row"><nav class="tabbar glass" aria-label="Разделы"><button class="tab on" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 3.5l8.5 7.5V20h-5.5v-6h-6v6H3.5Z"/></svg>Главная</button><button class="tab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M7 4h10"/></svg>Медиатека</button><button class="tab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14"/></svg>Офлайн</button><button class="tab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3m0 13v3M2.5 12h3m13 0h3M5.3 5.3l2.1 2.1m9.2 9.2 2.1 2.1M5.3 18.7l2.1-2.1m9.2-9.2 2.1-2.1"/></svg>Настройки</button></nav><button class="tab-search glass" aria-label="Поиск"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["coral","blue","red","orange","yellow","green","mint","teal","indigo","purple","pink"],"default":"coral"},"transparency":{"editor":"enum","options":["glass","reduced"],"default":"glass"},"$preview":{"width":600,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', accent: this.props.accent ?? 'coral', transparency: this.props.transparency ?? 'glass' };
  }
}
</script>
</body>
</html>
