<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mac · узкое окно</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vf.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="mac-win vf" data-theme="{{theme}}" data-accent="{{accent}}" data-transparency="{{transparency}}" style="width: 880px; height: 700px;">
  <div class="mac-toolbar">
    <div class="lights"><i></i><i></i><i></i></div>
    <button class="mac-btn icon" aria-label="Показать боковую панель"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <button class="mac-btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Главная</button>
    <span class="grow"></span>
    <button class="mac-btn icon" aria-label="Поиск ⌘F"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
    <button class="mac-btn icon" aria-label="Скачать для офлайна"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14"/></svg></button>
    <button class="mac-btn icon" aria-label="Ещё"><svg class="f" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
  </div>
  <div style="padding: 0 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0;">
    <div class="media" style="height: 400px; border-radius: 12px;"><div class="art a9"></div><div class="shade-b"></div>
      <div style="position: absolute; left: 14px; right: 14px; bottom: 12px;">
        <div class="tl thin"><i class="pl" style="width: 22%;"></i><i class="knob" style="left: 22%; width: 12px; height: 12px; margin: -6px 0 0 -6px;"></i></div>
        <div class="row" style="gap: 6px; margin-top: 8px;"><button class="pctl glass-media" style="width: 34px; height: 34px;" aria-label="Пауза"><svg class="f s18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg></button><span class="t-c1 t-num" style="font-weight: 700;">01:48 / 08:12</span><span class="grow"></span><button class="qbtn glass-media" style="min-height: 28px; font-size: 12px;">1×</button><button class="qbtn glass-media" style="min-height: 28px; font-size: 12px;">Авто</button><button class="qbtn glass-media" style="min-height: 28px; font-size: 12px;" aria-label="Ещё настройки плеера">•••</button></div>
      </div>
    </div>
    <div class="row between"><div><h1 class="t-hl" style="font-size: 18px;">Night ferry to the islands</h1><p class="t-c1 t-sec">Night Walks · 21 тыс.</p></div><button class="mac-btn" style="background: var(--action); color: var(--onAction);">Подписаться</button></div>
    <div class="seg" style="width: 360px;"><span class="on" style="min-height: 24px; font-size: 12px;">Далее</span><span style="min-height: 24px; font-size: 12px;">Описание</span><span style="min-height: 24px; font-size: 12px;">Комментарии</span></div>
    <p class="t-c1 t-sec">Ширина &lt; 1000 pt: боковая панель и инспектор сворачиваются, инспектор переходит под видео. Минимальный размер окна не меняется без проверки.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["coral","blue","red","orange","yellow","green","mint","teal","indigo","purple","pink"],"default":"coral"},"transparency":{"editor":"enum","options":["glass","reduced"],"default":"glass"},"$preview":{"width":880,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', accent: this.props.accent ?? 'coral', transparency: this.props.transparency ?? 'glass' };
  }
}
</script>
</body>
</html>
