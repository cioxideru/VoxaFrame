<!-- @dsCard group="Overlays" height=380 width=900 subtitle="VF/Sheet" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/Sheet</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-row" style="align-items:flex-end;gap:24px;flex-wrap:nowrap">
<div><div class="vf-eyebrow" style="margin-bottom:8px">Bottom sheet · iPhone</div><div class="vf-sheet" style="width:300px;border-bottom-left-radius:0;border-bottom-right-radius:0"><div class="vf-grabber"></div><div class="vf-sheet-head"><h3>Captions</h3><button class="vf-closebtn" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></svg></button></div><div class="vf-option"><span>Off</span></div><div class="vf-option"><span>English</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div><div class="vf-option"><span>Русский (auto)</span></div><div class="vf-option"><span>Español</span></div></div></div>
<div><div class="vf-eyebrow" style="margin-bottom:8px">Popover · iPad / Mac</div><div style="display:grid;justify-items:start;gap:8px"><button class="vf-btn vf-btn--secondary"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"/></svg>Captions</button><div class="vf-sheet" style="width:260px"><div class="vf-sheet-head"><h3>Captions</h3></div><div class="vf-option"><span>Off</span></div><div class="vf-option"><span>English</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div><div class="vf-option"><span>Русский (auto)</span></div></div></div></div>
<div style="flex:1;min-width:290px"><div class="vf-eyebrow" style="margin-bottom:8px">Dialog · busy</div><div class="vf-dialog"><h3>Save for offline</h3><p>1080p video + original audio · 200 MB</p><div class="vf-row"><button class="vf-btn vf-btn--secondary">Cancel</button><button class="vf-btn vf-btn--primary" aria-busy="true" style="min-width:120px"><span class="vf-spinner" aria-hidden="true"></span>Saving</button></div></div></div>
</div>
</div>
</body>
</html>
