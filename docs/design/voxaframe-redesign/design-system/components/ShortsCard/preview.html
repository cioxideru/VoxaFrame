<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/ShortsCard</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div><div class="vf-eyebrow" style="margin-bottom:8px">Shelf · default / focused / loading</div><div class="vf-row" style="gap:16px;align-items:flex-start;flex-wrap:nowrap">
<article class="vf-videocard" style="width:150px"><button class="vf-video-open" aria-label="Play Morning light"><div class="vf-thumb vf-art2 vf-thumb--shorts" role="img" aria-label="Fictional artwork"><span class="vf-duration">0:42</span></div><span class="vf-card-title" style="margin-right:0">Morning light in 40 seconds</span><span class="vf-meta" style="padding:0">Everyday Films</span></button></article>
<article class="vf-videocard vf-tvfocus" style="width:150px"><button class="vf-video-open" aria-label="Play Sound check"><div class="vf-thumb vf-art3 vf-thumb--shorts" role="img" aria-label="Fictional artwork"><span class="vf-duration">0:58</span></div><span class="vf-card-title" style="margin-right:0">One-minute sound check</span><span class="vf-meta" style="padding:0">Sound Room</span></button></article>
<article class="vf-videocard" style="width:150px"><button class="vf-video-open" aria-label="Play Night walk"><div class="vf-thumb vf-art4 vf-thumb--shorts" role="img" aria-label="Fictional artwork"><span class="vf-duration">0:31</span></div><span class="vf-card-title" style="margin-right:0">Night walk, one take</span><span class="vf-meta" style="padding:0">Night Walks</span></button></article>
<div style="width:150px"><div class="vf-thumb vf-thumb--shorts vf-skeleton"></div><div class="vf-skel-line" style="margin-top:12px;width:90%"></div><div class="vf-skel-line" style="margin-top:8px;width:60%"></div></div>
</div></div>
</div>
</body>
</html>
