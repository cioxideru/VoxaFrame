<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/Player</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-col" style="gap:14px">
<div class="vf-media vf-art0" style="height:390px;position:relative">
<div class="vf-media-top"><b>The long way home</b><button class="vf-btn vf-btn--icon" style="color:var(--onMedia)" aria-label="Close player"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></svg></button></div>
<div class="vf-transport" style="position:absolute;top:38%;left:0;right:0"><button class="vf-btn vf-btn--icon" aria-label="Previous video"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 5l-9 7 9 7Z"/></svg></button><button class="vf-btn vf-btn--icon" aria-label="Back 10 seconds"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/></svg></button><button class="vf-btn vf-btn--icon vf-largeplay" aria-label="Pause"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M16 4v16"/></svg></button><button class="vf-btn vf-btn--icon" aria-label="Forward 10 seconds"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg></button><button class="vf-btn vf-btn--icon" aria-label="Next video"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14M6 5l9 7-9 7Z"/></svg></button></div>
<div class="vf-playerbar" style="position:absolute;left:0;right:0;bottom:0"><div class="vf-timeline" role="slider" aria-label="Playback position" aria-valuetext="6 minutes 24 seconds of 18 minutes 42 seconds"><span class="vf-buffered" style="width:52%"></span><span class="vf-played" style="width:34%"></span><span class="vf-knob" style="left:34%"></span></div><div class="vf-time"><span>06:24</span><span>18:42</span></div>
<div class="vf-row" style="margin-top:14px;gap:10px"><span style="margin-right:auto;font-size:13px">720p · Original audio</span><button class="vf-mediachip">Quality</button><button class="vf-mediachip">Audio</button><button class="vf-mediachip">Captions</button><button class="vf-mediachip">1×</button><button class="vf-mediachip">Fit</button></div></div></div>
<div class="vf-row" style="gap:20px;flex-wrap:nowrap"><div style="flex:1"><div class="vf-eyebrow">Now playing</div><div style="font-size:20px;line-height:25px;font-weight:600;margin-top:4px">The long way home</div><p class="vf-meta">Field Notes · Requested: 1080p · Playing: 720p available fallback</p></div>
<div class="vf-translation" style="flex:1"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-5v16l-5-5H3ZM16 8q6 4 0 8"/></svg><div><b>Готовим перевод…</b><p>Можно продолжать слушать оригинал.</p></div></div></div>
</div>
</div>
</body>
</html>
