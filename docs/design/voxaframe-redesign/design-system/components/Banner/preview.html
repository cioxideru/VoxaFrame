<!-- @dsCard group="Settings & feedback" height=330 width=760 subtitle="VF/Banner" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/Banner</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-col" style="gap:10px;max-width:620px">
<div class="vf-banner vf-banner--info"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><p>Новые видео в подписках</p><button class="vf-btn vf-btn--plain">Refresh</button></div>
<div class="vf-banner vf-banner--warning"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20Z"/><path d="M12 9v5M12 17v.5"/></svg><p>Playing 720p — 1080p isn't available for this video.</p><button class="vf-closebtn" aria-label="Dismiss"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></svg></button></div>
<div class="vf-banner vf-banner--error"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg><p>Не удалось обновить ленту. Показаны сохранённые результаты.</p><button class="vf-btn vf-btn--secondary">Try again</button></div>
<div class="vf-banner vf-banner--success"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg><p>Saved for offline · 200 MB</p><button class="vf-closebtn" aria-label="Dismiss"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></svg></button></div>
</div>
</div>
</body>
</html>
