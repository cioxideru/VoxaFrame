<!-- @dsCard group="Content" height=560 width=900 subtitle="VF/VideoCard" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/VideoCard</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-col" style="gap:22px">
<div><div class="vf-eyebrow" style="margin-bottom:8px">Grid · default / focused / watched / live / upcoming</div><div class="vf-grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:16px">
<article class="vf-videocard "><button class="vf-video-open" aria-label="Play The long way home"><div class="vf-thumb vf-art0 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">FIELD / NOTES</span><span class="vf-duration">18:42</span></div><span class="vf-card-title">The long way home</span><span class="vf-meta">Field Notes · 2 days ago</span></button><button class="vf-btn vf-btn--icon vf-cardmenu" aria-label="More options for The long way home"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></article>
<article class="vf-videocard vf-tvfocus"><button class="vf-video-open" aria-label="Play Design in motion"><div class="vf-thumb vf-art1 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">DESIGN / MOTION</span><span class="vf-duration">12:08</span></div><span class="vf-card-title">Design in motion</span><span class="vf-meta">Studio North · 3 days ago</span></button><button class="vf-btn vf-btn--icon vf-cardmenu" aria-label="More options for Design in motion"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></article>
<article class="vf-videocard "><button class="vf-video-open" aria-label="Play A slower morning"><div class="vf-thumb vf-art2 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">SLOW / LIVING</span><span class="vf-duration">24:16</span><span class="vf-watched"><span style="width:100%"></span></span></div><span class="vf-card-title">A slower morning</span><span class="vf-meta">Everyday Films · Watched</span></button><button class="vf-btn vf-btn--icon vf-cardmenu" aria-label="More options for A slower morning"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></article>
<article class="vf-videocard "><button class="vf-video-open" aria-label="Play Cities after dark"><div class="vf-thumb vf-art4 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">AFTER / DARK</span><span class="vf-badge" style="background:var(--danger);color:var(--background)">LIVE</span></div><span class="vf-card-title">Cities after dark</span><span class="vf-meta">Night Walks · 1.2K watching</span></button><button class="vf-btn vf-btn--icon vf-cardmenu" aria-label="More options for Cities after dark"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></article>
<article class="vf-videocard "><button class="vf-video-open" aria-label="Play Small ideas, big worlds"><div class="vf-thumb vf-art5 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">SMALL / WORLDS</span><span class="vf-badge">UPCOMING</span></div><span class="vf-card-title">Small ideas, big worlds</span><span class="vf-meta">Frame by Frame · Tomorrow 18:00</span></button><button class="vf-btn vf-btn--icon vf-cardmenu" aria-label="More options for Small ideas, big worlds"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></article>
</div></div>
<div class="vf-row" style="align-items:flex-start;gap:24px;flex-wrap:nowrap">
<div style="flex:1"><div class="vf-eyebrow" style="margin-bottom:8px">List · in progress</div><article class="vf-videocard vf-videocard--list"><button class="vf-video-open" aria-label="Play Inside the sound"><div class="vf-thumb vf-art3 " role="img" aria-label="Fictional artwork"><span class="vf-duration">09:51</span><span class="vf-watched"><span style="width:40%"></span></span></div></button><div><span class="vf-card-title" style="margin-right:44px">Inside the sound</span><span class="vf-meta">Sound Room · 4 min left</span></div><button class="vf-btn vf-btn--icon vf-cardmenu" aria-label="More options"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></article></div>
<div style="width:200px"><div class="vf-eyebrow" style="margin-bottom:8px">Loading</div><div class="vf-thumb vf-skeleton"></div><div class="vf-skel-line" style="margin-top:12px;width:80%"></div><div class="vf-skel-line" style="margin-top:8px;width:50%"></div></div>
<div style="width:200px"><div class="vf-eyebrow" style="margin-bottom:8px">Error</div><div class="vf-thumb vf-skeleton" style="display:grid;place-items:center;color:var(--secondary)"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20Z"/><path d="M12 9v5M12 17v.5"/></svg></div><span class="vf-card-title" style="margin-right:0">Не удалось загрузить</span><button class="vf-btn vf-btn--plain" style="padding:0;min-height:32px">Попробовать ещё раз</button></div>
</div></div>
</div>
</body>
</html>
