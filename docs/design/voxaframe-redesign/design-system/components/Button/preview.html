<!-- @dsCard group="Actions" height=270 width=760 subtitle="VF/Button" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/Button</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-col" style="gap:18px">
<div><div class="vf-eyebrow" style="margin-bottom:8px">Variants</div><div class="vf-row"><button class="vf-btn vf-btn--primary"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 4 12 8-12 8Z"/></svg>Play video</button><button class="vf-btn vf-btn--secondary">Subscribe</button><button class="vf-btn vf-btn--plain">View channel</button><button class="vf-btn vf-btn--destructive">Delete file</button><button class="vf-btn vf-btn--icon" aria-label="More options"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div></div>
<div><div class="vf-eyebrow" style="margin-bottom:8px">States</div><div class="vf-row"><button class="vf-btn vf-btn--primary">Default</button><button class="vf-btn vf-btn--primary is-pressed">Pressed</button><button class="vf-btn vf-btn--secondary is-focused-ring">Keyboard focus</button><button class="vf-btn vf-btn--primary" disabled>Unavailable</button><button class="vf-btn vf-btn--primary" aria-busy="true" style="min-width:150px"><span class="vf-spinner" aria-hidden="true"></span>Saving</button></div></div>
<p class="vf-note">Disabled: причина рядом — «Нет подключения». Loading держит ширину и не принимает повторные нажатия.</p>
</div>
</div>
</body>
</html>
