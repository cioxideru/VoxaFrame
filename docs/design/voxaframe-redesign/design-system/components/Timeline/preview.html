<!-- @dsCard group="Playback" height=330 width=760 subtitle="VF/Timeline" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/Timeline</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-media vf-art4" style="border-radius:var(--radius-card)"><div class="vf-playerbar" style="display:grid;gap:22px">
<div><div class="vf-eyebrow" style="margin-bottom:8px"><span style="color:var(--onMedia)">VOD · idle</span></div><div class="vf-timeline" role="slider" aria-label="Playback position"><span class="vf-buffered" style="width:58%"></span><span class="vf-played" style="width:34%"></span><span class="vf-knob" style="left:34%"></span></div><div class="vf-time"><span>06:24</span><span>−12:18</span></div></div>
<div><div class="vf-eyebrow" style="margin-bottom:8px"><span style="color:var(--onMedia)">VOD · scrubbing</span></div><div class="vf-timeline is-scrubbing" role="slider" aria-label="Playback position"><span class="vf-buffered" style="width:58%"></span><span class="vf-played" style="width:62%"></span><span class="vf-knob" style="left:62%"></span></div><div class="vf-time"><span>11:36</span><span>−07:06</span></div></div>
<div class="vf-row" style="gap:28px;flex-wrap:nowrap"><div style="flex:1"><div class="vf-eyebrow" style="margin-bottom:8px"><span style="color:var(--onMedia)">Live · no DVR</span></div><div class="vf-row"><span class="vf-livepill">LIVE</span><span class="vf-note" style="color:var(--onMedia)">Перемотка недоступна в этом эфире</span></div></div>
<div style="flex:1"><div class="vf-eyebrow" style="margin-bottom:8px"><span style="color:var(--onMedia)">Disabled</span></div><div class="vf-timeline is-disabled"><span class="vf-played" style="width:0"></span></div><div class="vf-time"><span>--:--</span><span>--:--</span></div></div></div>
</div></div>
</div>
</body>
</html>
