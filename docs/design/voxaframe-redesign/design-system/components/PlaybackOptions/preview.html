<!-- @dsCard group="Playback" height=420 width=760 subtitle="VF/PlaybackOptions" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/PlaybackOptions</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-row" style="align-items:flex-start;gap:24px;flex-wrap:nowrap">
<div class="vf-sheet" style="width:340px"><div class="vf-sheet-head"><h3>Quality</h3><button class="vf-closebtn" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></svg></button></div>
<div style="padding:0 20px 10px" class="vf-note">Saved choice: 1080p · Playing now: 720p (1080p not available for this video)</div>
<div class="vf-option"><span>Auto</span></div><div class="vf-option"><span>1080p</span><span class="vf-row" style="gap:6px"><small>Saved</small><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span></div><div class="vf-option is-unavailable"><span>1440p</span><small>Not available</small></div><div class="vf-option"><span>720p</span><small>Playing now</small></div><div class="vf-option"><span>480p</span></div></div>
<div class="vf-sheet" style="width:300px"><div class="vf-sheet-head"><h3>Audio</h3><button class="vf-closebtn" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></svg></button></div>
<div class="vf-option"><span>English · Original</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div><div class="vf-option"><span>Español · Dubbed</span></div><div class="vf-option"><span>Русский · Перевод</span><small>Preparing…</small></div>
<div class="vf-sheet-head" style="border-top:1px solid var(--border);margin-top:4px"><h3>Speed</h3></div><div style="padding:0 20px 16px" class="vf-chips"><button class="vf-chip" aria-pressed="false">0.75×</button><button class="vf-chip" aria-pressed="true">1×</button><button class="vf-chip" aria-pressed="false">1.25×</button><button class="vf-chip" aria-pressed="false">1.5×</button></div></div>
</div>
</div>
</body>
</html>
