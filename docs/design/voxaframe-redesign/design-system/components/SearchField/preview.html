<!-- @dsCard group="Actions" height=330 width=760 subtitle="VF/SearchField" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/SearchField</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-col" style="gap:16px;max-width:520px">
<div><div class="vf-eyebrow" style="margin-bottom:8px">Empty</div><label class="vf-search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input aria-label="Search" placeholder="Search videos and channels"></label></div>
<div><div class="vf-eyebrow" style="margin-bottom:8px">Editing · focused</div><label class="vf-search is-editing"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input aria-label="Search" value="slow living"><button class="vf-clear" aria-label="Clear search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></svg></button></label></div>
<div><div class="vf-eyebrow" style="margin-bottom:8px">Submitting</div><label class="vf-search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input aria-label="Search" value="slow living"><span class="vf-spinner" style="width:18px;height:18px;border-radius:50%;border:2px solid var(--secondary);border-right-color:transparent" aria-label="Searching"></span></label></div>
<div><div class="vf-eyebrow" style="margin-bottom:8px">No results</div><p class="vf-meta">Ничего не найдено. Попробуйте другой запрос.</p></div>
</div>
</div>
</body>
</html>
