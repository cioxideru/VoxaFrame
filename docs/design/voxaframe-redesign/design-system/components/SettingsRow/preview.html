<!-- @dsCard group="Settings & feedback" height=430 width=760 subtitle="VF/SettingsRow" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/SettingsRow</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-list" style="max-width:560px">
<div class="vf-listrow"><div class="vf-listrow-text"><b>Appearance</b></div><span class="vf-value">System<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"class="vf-chevron"><path d="m9 5 7 7-7 7"/></svg></span></div>
<div class="vf-listrow"><div class="vf-listrow-text"><b>Liquid Glass</b><span class="vf-meta">Turn off for an opaque, high-legibility background.</span></div><input type="checkbox" class="vf-toggle" aria-label="Liquid Glass" checked></div>
<div class="vf-listrow"><div class="vf-listrow-text"><b>Playback quality</b><span class="vf-meta">Used for new videos when available.</span></div><span class="vf-value" style="color:var(--text);font-weight:600">1080p<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"class="vf-chevron"><path d="m9 5 7 7-7 7"/></svg></span></div>
<div class="vf-listrow"><div class="vf-listrow-text"><b>Shorts speed</b><span class="vf-meta">Independent from regular videos.</span></div><span class="vf-value">1.25×<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"class="vf-chevron"><path d="m9 5 7 7-7 7"/></svg></span></div>
<div class="vf-listrow" style="opacity:.55"><div class="vf-listrow-text"><b>Background audio</b><span class="vf-meta">Not available on Apple TV.</span></div><input type="checkbox" class="vf-toggle" aria-label="Background audio" disabled></div>
<div class="vf-listrow"><div class="vf-listrow-text"><b>Translation service</b><span class="vf-status vf-status--danger"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg>Couldn't connect. Check your connection.</span></div><button class="vf-btn vf-btn--plain">Try again</button></div>
</div>
</div>
</body>
</html>
