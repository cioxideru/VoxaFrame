<!-- @dsCard group="Playback" height=360 width=760 subtitle="VF/Transport" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/Transport</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-media vf-art3" style="padding:28px 20px;display:grid;gap:26px">
<div><div class="vf-eyebrow" style="color:var(--onMedia);margin-bottom:10px">Playing · first in queue</div><div class="vf-transport"><button class="vf-btn vf-btn--icon" aria-label="Previous video" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 5l-9 7 9 7Z"/></svg></button><button class="vf-btn vf-btn--icon" aria-label="Back 15 seconds"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/></svg></button><button class="vf-btn vf-btn--icon vf-largeplay" aria-label="Pause"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M16 4v16"/></svg></button><button class="vf-btn vf-btn--icon" aria-label="Forward 30 seconds"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg></button><button class="vf-btn vf-btn--icon" aria-label="Next video"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14M6 5l9 7-9 7Z"/></svg></button></div><div class="vf-note" style="color:var(--onMedia);text-align:center;margin-top:10px">Back 15 s · Forward 30 s — from settings · Previous unavailable</div></div>
<div class="vf-row" style="justify-content:center;gap:40px"><div style="text-align:center"><div class="vf-transport"><button class="vf-btn vf-btn--icon vf-largeplay" aria-label="Play"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 4 12 8-12 8Z"/></svg></button></div><div class="vf-note" style="color:var(--onMedia);margin-top:8px">Paused</div></div>
<div style="text-align:center"><div class="vf-transport"><button class="vf-btn vf-btn--icon vf-largeplay" aria-label="Buffering" aria-busy="true"><span class="vf-spinner" style="width:30px;height:30px;border-width:3px"></span></button></div><div class="vf-note" style="color:var(--onMedia);margin-top:8px">Buffering</div></div></div>
</div>
</div>
</body>
</html>
