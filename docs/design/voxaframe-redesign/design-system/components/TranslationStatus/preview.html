<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/TranslationStatus</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-col" style="gap:10px;max-width:560px">
<div class="vf-translation"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-5v16l-5-5H3ZM16 8q6 4 0 8"/></svg><div><b>Перевод выключен</b><p>Слушаете оригинал · English</p></div><button class="vf-btn vf-btn--secondary">Включить</button></div>
<div class="vf-translation"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><div><b>Запрашиваем перевод · Русский</b><p>Это может занять несколько минут.</p></div><span class="vf-spinner" style="width:20px;height:20px;border-radius:50%;border:2px solid var(--secondary);border-right-color:transparent" aria-hidden="true"></span></div>
<div class="vf-translation"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-5v16l-5-5H3ZM16 8q6 4 0 8"/></svg><div><b>Готовим перевод…</b><p>Можно продолжать слушать оригинал.</p></div></div>
<div class="vf-translation"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"style="color:var(--success)"><path d="m5 12 5 5 9-10"/></svg><div><b>Перевод готов · Русский</b><p><span class="vf-status vf-status--success">Синхронизирован с видео</span></p></div><button class="vf-btn vf-btn--plain">Оригинал</button></div>
<div class="vf-translation"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"style="color:var(--danger)"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg><div><b>Перевод пока недоступен</b><p>Можно слушать оригинал.</p></div><button class="vf-btn vf-btn--secondary">Попробовать ещё раз</button></div>
</div>
</div>
