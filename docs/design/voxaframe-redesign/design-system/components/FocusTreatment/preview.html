<!-- @dsCard group="Accessibility" height=360 width=900 subtitle="VF/FocusTreatment" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VF/FocusTreatment</title>
<style>html,body{margin:0;background:var(--background)}body{padding:20px}</style></head>
<body>
<div class="vf-scene" style="background:transparent">
<div class="vf-scene vf-tv" style="padding:24px;border-radius:24px"><div class="vf-row" style="justify-content:space-between;margin-bottom:18px"><div class="vf-row" style="gap:8px"><span class="vf-eyebrow">Selected tab</span><button class="vf-navitem" aria-current="page" style="padding:10px 18px;font-size:15px">Home</button></div><span class="vf-eyebrow">Focused ≠ selected ≠ playing</span></div>
<div class="vf-grid" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:32px">
<article class="vf-videocard vf-tvfocus"><button class="vf-video-open" aria-label="Play The long way home"><div class="vf-thumb vf-art0 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">FIELD / NOTES</span><span class="vf-duration">18:42</span></div><span class="vf-card-title">The long way home</span><span class="vf-meta">Focused</span></button></article>
<article class="vf-videocard "><button class="vf-video-open" aria-label="Play Design in motion"><div class="vf-thumb vf-art1 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">DESIGN / MOTION</span><span class="vf-duration">12:08</span></div><span class="vf-card-title">Design in motion</span><span class="vf-meta">Studio North</span></button></article>
<article class="vf-videocard "><button class="vf-video-open" aria-label="Play Inside the sound"><div class="vf-thumb vf-art3 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">SOUND / ROOM</span><span class="vf-duration">09:51</span><span class="vf-badge" style="background:var(--action);color:var(--onAction)">PLAYING</span></div><span class="vf-card-title">Inside the sound</span><span class="vf-meta"><span class="vf-current">Now playing</span></span></button></article>
<article class="vf-videocard "><button class="vf-video-open" aria-label="Play A slower morning"><div class="vf-thumb vf-art2 " role="img" aria-label="Fictional artwork"><span class="vf-art-label">SLOW / LIVING</span><span class="vf-duration">24:16</span></div><span class="vf-card-title">A slower morning</span><span class="vf-meta">Everyday Films</span></button></article>
</div><p class="vf-note" style="margin-top:18px">Select — play · Back — close the top layer, then return focus to this card</p></div>
</div>
</body>
</html>
