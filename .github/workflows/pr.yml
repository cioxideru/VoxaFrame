name: PR
on:
  pull_request:
  push: { branches: [main] }
concurrency: { group: "pr-${{ github.ref }}", cancel-in-progress: true }
jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Pin deliberately; bump when the maintainer upgrades. Verify this path exists
        # on the actual macos-26 runner image before relying on this workflow — it was
        # written to match the maintainer's local Xcode 27.0 but GitHub's hosted image
        # may lag or differ. `ls /Applications | grep Xcode` on the runner if this fails.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tools
        run: brew install swiftlint
      - name: Placeholder secrets (fork-safe)
        run: cp SmartTubeApp/Config/Secrets.xcconfig.example SmartTubeApp/Config/Secrets.xcconfig
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            SmartTubeIOS/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
      - name: Docs sanity
        run: |
          test $(wc -l < AGENTS.md) -le 200
          head -1 CLAUDE.md | grep -q '^@AGENTS.md$'
          scripts/check-doc-links.sh          # WS2-T2.1 adds; until then `true`
      - name: Gate, SwiftLint, iOS & tvOS builds
        run: VERIFY_SCOPE=build scripts/verify.sh
      - name: Unit tests (Xcode, iOS sim)   # once WS3-T3.4 adds the Unit plan
        if: hashFiles('SmartTubeApp/Unit.xctestplan') != ''
        run: xcodebuild test -workspace SmartTube.xcworkspace -scheme SmartTube -testPlan Unit -destination 'platform=iOS Simulator,name=iPhone 17' -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO -resultBundlePath out/unit.xcresult
      - uses: kishikawakatsumi/xcresulttool@v1
        if: success() || failure()
        with: { path: out/unit.xcresult, show-passed-tests: false }
